<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Base with gentle rounded corner -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Note Sheet with soft drop shadow -->
  <g filter="url(#shadow)">
    <!-- Main Paper Base -->
    <rect x="116" y="96" width="280" height="320" rx="28" fill="#ffffff"/>
    
    <!-- Spine Accent -->
    <path d="M 116 124 C 116 108.5 128.5 96 144 96 L 152 96 L 152 416 L 144 416 C 128.5 416 116 403.5 116 388 Z" fill="#e2e8f0"/>
    
    <!-- Amber Ribbon Bookmark -->
    <path d="M 288 96 L 288 180 L 308 162 L 328 180 L 328 96 Z" fill="url(#amberGrad)"/>

    <!-- Content Note lines -->
    <!-- Line 1 (Header line) -->
    <rect x="176" y="148" width="88" height="12" rx="6" fill="#0f172a"/>

    <!-- Line 2 -->
    <rect x="176" y="196" width="160" height="10" rx="5" fill="#94a3b8"/>
    
    <!-- Line 3 -->
    <rect x="176" y="232" width="144" height="10" rx="5" fill="#cbd5e1"/>
    
    <!-- Line 4 -->
    <rect x="176" y="268" width="152" height="10" rx="5" fill="#cbd5e1"/>
    
    <!-- Line 5 -->
    <rect x="176" y="304" width="112" height="10" rx="5" fill="#cbd5e1"/>

    <!-- Checklist dots -->
    <circle cx="164" cy="201" r="4" fill="#3b82f6"/>
    <circle cx="164" cy="237" r="4" fill="#10b981"/>
    <circle cx="164" cy="273" r="4" fill="#f59e0b"/>
    <circle cx="164" cy="309" r="4" fill="#8b5cf6"/>

    <!-- Pencil Icon in bottom corner -->
    <g transform="translate(300, 310) rotate(-45)">
      <rect x="0" y="0" width="16" height="52" rx="4" fill="url(#amberGrad)"/>
      <polygon points="0,52 16,52 8,66" fill="#fcd34d"/>
      <polygon points="6,62 10,62 8,66" fill="#0f172a"/>
      <rect x="0" y="0" width="16" height="10" rx="2" fill="#e2e8f0"/>
    </g>
  </g>
</svg>
